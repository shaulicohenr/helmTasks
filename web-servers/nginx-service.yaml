apiVersion: v1
kind: Service
metadata:
  name: {{ include "web-servers.nginx.name" . }}
  labels:
    app: nginx
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: {{ .Values.nginx.containerPort }}
      protocol: TCP
      name: http
  selector:
    app: nginx
    release: {{ .Release.Name }}
