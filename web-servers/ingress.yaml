{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web-servers
  labels:
    release: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      hosts:
        - {{ .Values.ingress.nginxHost | quote }}
        - {{ .Values.ingress.apacheHost | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.nginxHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "web-servers.nginx.name" . }}
                port:
                  number: {{ .Values.nginx.service.port }}
    - host: {{ .Values.ingress.apacheHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "web-servers.apache.name" . }}
                port:
                  number: {{ .Values.apache.service.port }}
{{- end }}
